# Render Blueprint — deploys the Woolworths dashboard with a permanent
# *.onrender.com URL. Native Python runtime (free-tier safe). Ships the
# pre-scraped SQLite snapshot (data/woolworths.db), so the deployed app has
# data immediately (no browser/scraping needed on the host).
#
# Usage: push this repo to GitHub, then in Render choose "New > Blueprint" and
# point it at this repo; Render reads this file automatically.
services:
  - type: web
    name: woolworths-intelligence
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py dashboard --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
