# Render Blueprint — deploys the live dashboard with a permanent *.onrender.com URL.
# Native Python runtime (free-tier safe; no Docker needed). Ships the pre-scraped
# SQLite snapshot (data/coles.db), so the deployed app has data immediately.
#
# Usage: push this repo to GitHub, then in Render choose "New > Blueprint" and
# point it at this repo; Render reads this file automatically.
services:
  - type: web
    name: coles-intelligence
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py dashboard --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
